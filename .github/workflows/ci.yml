name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Run tests
        run: go test ./... -race -count=1 -coverprofile=coverage.out

      - name: Run go vet
        run: go vet ./...

      - name: Run lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
